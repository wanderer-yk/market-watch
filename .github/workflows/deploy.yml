name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # 只发布站点真正 fetch 的静态资源；reports/（运维脚本/SOP，含内网主机名路径）、
      # 死 data/ 目录等仓库工作文件不再进公开 Pages（防内部信息泄露）。
      - name: Assemble site assets
        run: |
          mkdir -p _site
          cp index.html app.js style.css .nojekyll _site/
          cp ./*.json _site/
          cp -r daily series _site/
          echo "--- published files: $(find _site -type f | wc -l) ---"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
